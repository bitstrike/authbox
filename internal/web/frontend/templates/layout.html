<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} - Authbox</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
  <script>
    (function() {
      var theme = localStorage.getItem('theme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body class="h-full bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100">
  <div class="min-h-full">
    <!-- Navigation -->
    <nav class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-14">
          <div class="flex items-center space-x-6">
            <a href="/" class="flex items-center"><img src="/static/authbox.png" alt="Authbox" style="height:36px"></a>
            <a href="/" class="nav-link{{if eq .CurrentPath "/"}} active{{end}}">Dashboard</a>
            {{if or .IsAdmin .IsOperator .IsViewer}}
            <a href="/users" class="nav-link{{if eq .CurrentPath "/users"}} active{{end}}">Users</a>
            <a href="/groups" class="nav-link{{if eq .CurrentPath "/groups"}} active{{end}}">Groups</a>
            <a href="/ssh" class="nav-link{{if eq .CurrentPath "/ssh"}} active{{end}}">SSH</a>
            <a href="/fido2" class="nav-link{{if eq .CurrentPath "/fido2"}} active{{end}}">FIDO2</a>
            {{end}}
            {{if .IsAdmin}}
            <a href="/service-accounts" class="nav-link{{if eq .CurrentPath "/service-accounts"}} active{{end}}">Service Accounts</a>
            <a href="/logs" class="nav-link{{if eq .CurrentPath "/logs"}} active{{end}}">Logs</a>
            <a href="/settings" class="nav-link{{if eq .CurrentPath "/settings"}} active{{end}}">Settings</a>
            <a href="/backup" class="nav-link{{if eq .CurrentPath "/backup"}} active{{end}}">Backup</a>
            {{end}}
          </div>
          <div class="flex items-center space-x-4">
            <a href="/status" id="status-indicator" class="status-dot green" title="System status"></a>
            <button onclick="toggleTheme()" class="p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700" title="Toggle theme">
              <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
              <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            </button>
            <span class="text-sm text-gray-600 dark:text-gray-400">{{.Email}}</span>
            <form method="POST" action="/logout" class="inline">
              <button type="submit" class="text-sm text-red-600 hover:text-red-800 dark:text-red-400">Logout</button>
            </form>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
      {{if .Flash}}
      <div class="flash flash-{{.Flash.Type}}" id="flash-notification">
        <span>{{.Flash.Text}}</span>
        <button onclick="this.parentElement.remove()" class="flash-close">&times;</button>
      </div>
      {{end}}
      {{template "content" .}}
    </main>
  </div>

  <!-- Reusable confirm modal (typed-phrase confirmation). Hidden by default;
       opened via: document.body.dispatchEvent(new CustomEvent('openConfirm', {detail: {...}})) -->
  <div id="confirm-modal" class="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
    <div class="modal">
      <h3 id="confirm-modal-title" class="modal-title"></h3>
      <div id="confirm-modal-body" class="modal-body"></div>
      <div id="confirm-modal-phrase-wrap" class="modal-phrase">
        <label class="label text-xs" id="confirm-modal-phrase-label" for="confirm-modal-input"></label>
        <input type="text" id="confirm-modal-input" class="input w-full" autocomplete="off" spellcheck="false">
      </div>
      <div class="modal-actions">
        <button type="button" id="confirm-modal-cancel" class="btn btn-secondary">Cancel</button>
        <button type="button" id="confirm-modal-confirm" class="btn btn-primary" disabled>Confirm</button>
      </div>
    </div>
  </div>

  <script>
    function toggleTheme() {
      var html = document.documentElement;
      html.classList.toggle('dark');
      localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    }
    (function() {
      var flash = document.getElementById('flash-notification');
      if (flash) {
        setTimeout(function() {
          flash.style.opacity = '0';
          setTimeout(function() { flash.remove(); }, 300);
        }, 5000);
      }
    })();
    document.body.addEventListener('htmx:configRequest', function(e) {
      var target = e.detail.elt;
      if (!target.classList || !target.classList.contains('table-container')) return;
      var url = e.detail.path.split('?')[0];
      if (e.detail.parameters.sort) return;
      try {
        var saved = JSON.parse(localStorage.getItem('tableSort:' + url));
        if (saved && saved.sort) {
          e.detail.parameters.sort = saved.sort;
          e.detail.parameters.order = saved.order || 'desc';
          if (saved.limit) e.detail.parameters.limit = saved.limit;
        }
      } catch(ex) {}
    });
    document.body.addEventListener('showFlash', function(e) {
      var d = e.detail;
      var el = document.createElement('div');
      el.className = 'flash flash-' + d.type;
      el.id = 'flash-notification';
      el.innerHTML = '<span>' + d.text + '</span><button onclick="this.parentElement.remove()" class="flash-close">&times;</button>';
      var main = document.querySelector('main');
      main.insertBefore(el, main.firstChild);
      setTimeout(function() {
        el.style.opacity = '0';
        setTimeout(function() { el.remove(); }, 300);
      }, 5000);
    });

    // Reusable confirm modal. Fire:
    //   document.body.dispatchEvent(new CustomEvent('openConfirm', {detail: {
    //     title, body, phrase, confirmLabel, danger, onConfirm
    //   }}))
    // - phrase (optional): if set, the confirm button stays disabled until the
    //   input matches it exactly. If omitted, it's a plain yes/no confirm.
    // - onConfirm: callback invoked when the user confirms.
    (function() {
      var overlay = document.getElementById('confirm-modal');
      var titleEl = document.getElementById('confirm-modal-title');
      var bodyEl = document.getElementById('confirm-modal-body');
      var phraseWrap = document.getElementById('confirm-modal-phrase-wrap');
      var phraseLabel = document.getElementById('confirm-modal-phrase-label');
      var input = document.getElementById('confirm-modal-input');
      var cancelBtn = document.getElementById('confirm-modal-cancel');
      var confirmBtn = document.getElementById('confirm-modal-confirm');
      var current = null;      // pending config
      var lastTrigger = null;  // element to restore focus to on close

      function close() {
        overlay.hidden = true;
        current = null;
        input.value = '';
        confirmBtn.classList.remove('btn-danger');
        confirmBtn.classList.add('btn-primary');
        document.removeEventListener('keydown', onKey);
        if (lastTrigger && lastTrigger.focus) { lastTrigger.focus(); }
        lastTrigger = null;
      }

      function armState() {
        if (current && current.phrase) {
          confirmBtn.disabled = (input.value !== current.phrase);
        } else {
          confirmBtn.disabled = false;
        }
      }

      function onKey(e) {
        if (e.key === 'Escape') { close(); }
      }

      input.addEventListener('input', armState);
      cancelBtn.addEventListener('click', close);
      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) { close(); }
      });
      confirmBtn.addEventListener('click', function() {
        if (confirmBtn.disabled) { return; }
        var cb = current && current.onConfirm;
        close();
        if (cb) { cb(); }
      });

      document.body.addEventListener('openConfirm', function(e) {
        current = e.detail || {};
        lastTrigger = document.activeElement;
        titleEl.textContent = current.title || 'Confirm';
        bodyEl.innerHTML = current.body || '';
        if (current.phrase) {
          phraseWrap.hidden = false;
          phraseLabel.textContent = 'Type "' + current.phrase + '" to confirm';
        } else {
          phraseWrap.hidden = true;
        }
        confirmBtn.textContent = current.confirmLabel || 'Confirm';
        if (current.danger) {
          confirmBtn.classList.remove('btn-primary');
          confirmBtn.classList.add('btn-danger');
        }
        input.value = '';
        armState();
        overlay.hidden = false;
        document.addEventListener('keydown', onKey);
        if (current.phrase) { input.focus(); } else { confirmBtn.focus(); }
      });

      // Delegated binding: any button with data-confirm-form opens the modal and,
      // on confirm, sets that form's hidden "confirm" field to the phrase and
      // submits it (htmx intercepts the submit for hx-post forms). Delegation on
      // document handles content swapped in via HTMX partials.
      var CONFIRM_PHRASE = 'yesiagree';
      document.addEventListener('click', function(e) {
        var btn = e.target.closest ? e.target.closest('[data-confirm-form]') : null;
        if (!btn) { return; }
        e.preventDefault();
        var form = document.getElementById(btn.getAttribute('data-confirm-form'));
        if (!form) { return; }
        document.body.dispatchEvent(new CustomEvent('openConfirm', {detail: {
          title: btn.getAttribute('data-confirm-title') || 'Confirm',
          body: btn.getAttribute('data-confirm-body') || '',
          phrase: CONFIRM_PHRASE,
          confirmLabel: btn.textContent.trim() || 'Confirm',
          danger: true,
          onConfirm: function() {
            var hidden = form.querySelector('input[name="confirm"]');
            if (hidden) { hidden.value = CONFIRM_PHRASE; }
            if (form.requestSubmit) { form.requestSubmit(); } else { form.submit(); }
          }
        }}));
      });
    })();
  </script>
</body>
</html>
